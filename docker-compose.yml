services:
  postgres:
    image: postgres:18.6
    container_name: traffic-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5445}:5432"
    volumes:
      - traffic_ai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - traffic-ai-net

  backend:
    build:
      context: ./backend
    container_name: traffic-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 18
      start_period: 45s
    networks:
      - traffic-ai-net

  ai-service:
    build:
      context: ./ai-service
    container_name: traffic-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000/api/internal
      SNAPSHOT_DIR: /data/snapshots
    volumes:
      - ./models:/data/models
      - ./videos:/data/videos:ro
      - ./snapshots:/data/snapshots
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - traffic-ai-net

  frontend:
    build:
      context: ./frontend
    container_name: traffic-ai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - traffic-ai-net

  gateway:
    image: nginx:1.31.6-alpine
    container_name: traffic-ai-gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "${WEB_HTTPS_PORT:-8443}:8443"
      - "${API_HOST_PORT:-8444}:8444"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - traffic-ai-net

networks:
  traffic-ai-net:
    name: traffic-ai-net

volumes:
  traffic_ai_postgres_data:
    external: true
    name: traffic_ai_postgres_data
