events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  proxy_read_timeout 3600s;

  # Docker embedded DNS. The `resolve` flag makes Nginx refresh service IPs
  # after Docker Compose recreates backend/frontend/AI containers.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  upstream traffic_ai_frontend {
    zone traffic_ai_frontend 64k;
    server frontend:80 resolve;
  }

  upstream traffic_ai_backend {
    zone traffic_ai_backend 64k;
    server backend:8000 resolve;
  }

  upstream traffic_ai_service {
    zone traffic_ai_service 64k;
    server ai-service:8001 resolve;
  }

  server {
    listen 8443 ssl;
    server_name traffic-ai.test localhost;

    ssl_certificate /etc/nginx/certs/traffic-ai.test.crt;
    ssl_certificate_key /etc/nginx/certs/traffic-ai.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /gateway-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /api/internal/ { return 404; }

    location = /_traffic_auth_check {
      internal;
      proxy_pass http://traffic_ai_backend/api/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_traffic_auth_operator {
      internal;
      proxy_pass http://traffic_ai_backend/api/auth/check?role=operator;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
      proxy_pass http://traffic_ai_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Only two browser-facing AI media endpoints. Every request is session-checked.
    location = /ai/media/video {
      auth_request /_traffic_auth_operator;
      proxy_pass http://traffic_ai_service/media/video;
      proxy_buffering off;
      proxy_set_header Host $http_host;
    }
    location ^~ /ai/streams/ {
      auth_request /_traffic_auth_check;
      proxy_pass http://traffic_ai_service/streams/;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $http_host;
    }
    location /ai/ { return 404; }

    location / {
      proxy_pass http://traffic_ai_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 8444 ssl;
    server_name traffic-ai.test localhost;

    ssl_certificate /etc/nginx/certs/traffic-ai.test.crt;
    ssl_certificate_key /etc/nginx/certs/traffic-ai.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /gateway-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /api/internal/ { return 404; }
    location / {
      proxy_pass http://traffic_ai_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
