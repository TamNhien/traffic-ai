events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  upstream traffic_ai_frontend {
    server frontend:80;
  }

  upstream traffic_ai_backend {
    server backend:8000;
  }

  server {
    listen 8443 ssl;
    server_name traffic-ai.test localhost;

    ssl_certificate /etc/nginx/certs/traffic-ai.test.crt;
    ssl_certificate_key /etc/nginx/certs/traffic-ai.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      proxy_pass http://traffic_ai_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://traffic_ai_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 8444 ssl;
    server_name traffic-ai.test localhost;

    ssl_certificate /etc/nginx/certs/traffic-ai.test.crt;
    ssl_certificate_key /etc/nginx/certs/traffic-ai.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://traffic_ai_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
