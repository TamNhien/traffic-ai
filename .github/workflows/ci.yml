name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, ai-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          pip install -r requirements-test.txt

      - name: Compile Python sources
        working-directory: ${{ matrix.component }}
        run: python -m compileall -q app tests

      - name: Run tests
        working-directory: ${{ matrix.component }}
        env:
          DATABASE_URL_OVERRIDE: sqlite+pysqlite:///:memory:
          AI_SERVICE_URL: http://127.0.0.1:8001
          PYTHONPATH: .
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

      - name: Build application images
        run: docker compose build backend ai-service frontend
