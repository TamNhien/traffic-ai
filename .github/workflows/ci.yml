name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_OVERRIDE: "sqlite+pysqlite:///:memory:"
      AI_SERVICE_URL: "http://127.0.0.1:8001"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Prepare writable CI paths
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/traffic-ai"
          mkdir -p "$root/datasets" "$root/training-runs" "$root/models" "$root/videos"
          {
            echo "AI_DATASET_ROOT=$root/datasets"
            echo "AI_TRAINING_ROOT=$root/training-runs"
            echo "AI_MODEL_ROOT=$root/models"
            echo "VIDEO_DIR=$root/videos"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            ai-service/requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          package-manager-cache: false

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-test.txt
          python -m compileall -q app tests alembic
          python -m pytest -q

      - name: AI service tests
        working-directory: ai-service
        run: |
          python -m pip install -r requirements-test.txt
          python -m compileall -q app tests
          python -m pytest -q

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install -g npm@12.1.0
          npm install
          npm audit --audit-level=high
          npm run build
