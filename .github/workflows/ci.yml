name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, ai-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-test.txt

      - name: Compile Python sources
        working-directory: ${{ matrix.component }}
        run: python -m compileall -q app tests

      - name: Run tests
        working-directory: ${{ matrix.component }}
        env:
          DATABASE_URL_OVERRIDE: "sqlite+pysqlite:///:memory:"
          AI_SERVICE_URL: http://127.0.0.1:8001
          PYTHONPATH: .
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.9.0'

      - name: Verify web branding assets
        working-directory: frontend
        run: |
          test -f public/favicon.svg
          test -f public/favicon.ico
          test -f public/logo.svg
          test -f public/site.webmanifest

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm install -g npm@12.1.0
          npm install
          npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

      - name: Build application images
        run: docker compose build backend ai-service frontend
