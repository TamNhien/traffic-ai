name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_DATASET_ROOT: ${{ runner.temp }}/traffic-ai/datasets
      AI_TRAINING_ROOT: ${{ runner.temp }}/traffic-ai/training-runs
      AI_MODEL_ROOT: ${{ runner.temp }}/traffic-ai/models
      VIDEO_DIR: ${{ runner.temp }}/traffic-ai/videos
      DATABASE_URL_OVERRIDE: "sqlite+pysqlite:///:memory:"
      AI_SERVICE_URL: "http://127.0.0.1:8001"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            ai-service/requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-test.txt
          python -m compileall -q app tests alembic
          python -m pytest -q

      - name: AI service tests
        working-directory: ai-service
        run: |
          mkdir -p "$AI_DATASET_ROOT" "$AI_TRAINING_ROOT" "$AI_MODEL_ROOT" "$VIDEO_DIR"
          python -m pip install -r requirements-test.txt
          python -m compileall -q app tests
          python -m pytest -q

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install -g npm@12.1.0
          npm install
          npm audit --audit-level=high
          npm run build
