name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci-release-reusable.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify VERSION matches tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '\r\n ' < VERSION)"
          if [ "$actual" != "$expected" ]; then
            echo "VERSION=$actual does not match tag=$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="traffic-ai-${GITHUB_REF_NAME}/" -o "dist/traffic-ai-${GITHUB_REF_NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="traffic-ai-${GITHUB_REF_NAME}/" -o "dist/traffic-ai-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/traffic-ai-${GITHUB_REF_NAME}.zip \
            dist/traffic-ai-${GITHUB_REF_NAME}.tar.gz \
            dist/SHA256SUMS.txt \
            --title "Traffic AI $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
