name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '\r\n ' < VERSION)"
          if [ "$actual" != "$expected" ]; then
            echo "VERSION=$actual does not match tag=$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL_OVERRIDE: "sqlite+pysqlite:///:memory:"
          AI_SERVICE_URL: http://127.0.0.1:8001
          PYTHONPATH: .
        run: |
          pip install -r requirements-test.txt
          python -m compileall -q app tests alembic
          python -m pytest -q

      - name: Test AI service
        working-directory: ai-service
        env:
          PYTHONPATH: .
        run: |
          pip install -r requirements-test.txt
          python -m compileall -q app tests
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Validate Docker Compose
        shell: bash
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

      - name: Build release archives
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="traffic-ai-${GITHUB_REF_NAME}/" -o "dist/traffic-ai-${GITHUB_REF_NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="traffic-ai-${GITHUB_REF_NAME}/" -o "dist/traffic-ai-${GITHUB_REF_NAME}.tar.gz" HEAD
          (cd dist && sha256sum traffic-ai-${GITHUB_REF_NAME}.zip traffic-ai-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt)

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/traffic-ai-${GITHUB_REF_NAME}.zip" \
            "dist/traffic-ai-${GITHUB_REF_NAME}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --title "Traffic AI $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
