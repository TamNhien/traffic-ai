name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.5.52'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DATABASE_URL_OVERRIDE: "sqlite+pysqlite:///:memory:"
      AI_SERVICE_URL: "http://127.0.0.1:8001"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify VERSION matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          version="$(tr -d '\r\n' < VERSION)"
          test "$tag" = "v$version" || {
            echo "VERSION=$version does not match tag=$tag" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")" || {
            echo "Checked-out source does not match release tag=$tag" >&2
            exit 1
          }

      - name: Prepare writable CI paths
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/traffic-ai"
          mkdir -p "$root/datasets" "$root/training-runs" "$root/models" "$root/videos"
          {
            echo "AI_DATASET_ROOT=$root/datasets"
            echo "AI_TRAINING_ROOT=$root/training-runs"
            echo "AI_MODEL_ROOT=$root/models"
            echo "VIDEO_DIR=$root/videos"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            ai-service/requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          package-manager-cache: false

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-test.txt
          python -m compileall -q app tests alembic
          python -m pytest -q

      - name: AI service tests
        working-directory: ai-service
        run: |
          python -m pip install -r requirements-test.txt
          python -m compileall -q app tests
          python -m pytest -q

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install -g npm@12.2.0
          npm install
          npm audit --audit-level=high
          npm run build

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          prefix="traffic-ai-$tag/"
          mkdir -p dist-release
          git archive --format=zip --prefix="$prefix" -o "dist-release/traffic-ai-$tag.zip" "refs/tags/$tag"
          git archive --format=tar.gz --prefix="$prefix" -o "dist-release/traffic-ai-$tag.tar.gz" "refs/tags/$tag"
          git show "refs/tags/$tag:README.md" > "dist-release/traffic-ai-$tag-README.md"
          (
            cd dist-release
            sha256sum "traffic-ai-$tag.zip" "traffic-ai-$tag.tar.gz" "traffic-ai-$tag-README.md" > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Traffic AI ${{ env.RELEASE_TAG }}
          body_path: dist-release/traffic-ai-${{ env.RELEASE_TAG }}-README.md
          fail_on_unmatched_files: true
          files: |
            dist-release/traffic-ai-${{ env.RELEASE_TAG }}.zip
            dist-release/traffic-ai-${{ env.RELEASE_TAG }}.tar.gz
            dist-release/traffic-ai-${{ env.RELEASE_TAG }}-README.md
            dist-release/SHA256SUMS.txt
