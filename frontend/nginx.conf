server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA entry must revalidate after a release; hashed Vite assets retain
  # their existing caching behavior. This also applies to SPA fallback routes.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
